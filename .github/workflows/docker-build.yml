name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches: [main, feature/teslamate_weather]
    tags:
      - "v*"

env:
  REGISTRY_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/teslamate
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/teslamate

permissions:
  contents: read
  packages: write

jobs:
  check_paths:
    uses: ./.github/workflows/check_paths.yml

  build:
    name: Build teslamate (${{ matrix.platform }})
    needs: check_paths
    if: needs.check_paths.outputs.githubfolder != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "linux/amd64"
            runs_on: "ubuntu-24.04"
            cache_key: amd64
          - platform: "linux/arm/v7"
            runs_on: "ubuntu-24.04"
            cache_key: arm
          - platform: "linux/arm64"
            runs_on: "self-hosted"
            cache_key: arm64
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR (for cache)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=teslamate_weather
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=teslamate_weather

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_key }}
          cache-to: type=gha,scope=${{ matrix.cache_key }},mode=max
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Write digest to file
        run: |
          echo "${{ steps.build.outputs.digest }}" > /tmp/digest.txt

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.cache_key }}
          path: /tmp/digest.txt

  manifest:
    name: Create multi-arch manifest
    needs: [check_paths, build]
    if: needs.check_paths.outputs.githubfolder != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create multi-arch manifest
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          AMD64_DIGEST=$(cat /tmp/digests/digest-amd64 2>/dev/null || echo "")
          ARMV7_DIGEST=$(cat /tmp/digests/digest-arm 2>/dev/null || echo "")
          ARM64_DIGEST=$(cat /tmp/digests/digest-arm64 2>/dev/null || echo "")
          
          if [ -z "$AMD64_DIGEST" ] || [ -z "$ARMV7_DIGEST" ] || [ -z "$ARM64_DIGEST" ]; then
            echo "Error: Missing digests"
            echo "AMD64: $AMD64_DIGEST"
            echo "ARMV7: $ARMV7_DIGEST"
            echo "ARM64: $ARM64_DIGEST"
            exit 1
          fi
          
          BASE_TAG="${REGISTRY_IMAGE}:teslamate_weather"
          
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:teslamate_weather" \
            "${REGISTRY_IMAGE}@sha256:${AMD64_DIGEST}" \
            "${REGISTRY_IMAGE}@sha256:${ARMV7_DIGEST}" \
            "${REGISTRY_IMAGE}@sha256:${ARM64_DIGEST}"
          echo "Created multi-arch manifest: ${BASE_TAG}"

  build-grafana:
    name: Build Grafana
    needs: check_paths
    if: needs.check_paths.outputs.githubfolder != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/teslamate-grafana
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
      - name: Build and push Grafana
        uses: docker/build-push-action@v6
        with:
          context: grafana
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-wechat:
    name: Build Wechat_Teslamate
    needs: check_paths
    if: needs.check_paths.outputs.githubfolder != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-wechat-${{ hashFiles('wechat_teslamate/Dockerfile', 'wechat_teslamate/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-wechat-

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/wechat-teslamate
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Build and push Wechat
        uses: docker/build-push-action@v6
        with:
          context: wechat_teslamate
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max